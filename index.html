/* 화면 깜빡임 없이 저장된 밝기 모드를 먼저 적용 (기본: 밝게) */
(function () {
  var t = 'light';
  try { if (localStorage.getItem('myStudyNote.theme') === 'dark') t = 'dark'; } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
  var m = document.getElementById('themeColor'); if (m) m.setAttribute('content', t === 'dark' ? '#262A3E' : '#F7F7FC');
})();

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* ===== 라벤더 미스트 v4 — 밝고 맑은 파스텔, 차분한 톤 (본문 대비 13:1) ===== */
:root{
  color-scheme:light;
  --bg:#F7F7FC; --surface:#FFFFFF; --surface-2:#F1F0FA; --input-bg:#FFFFFF;
  --text:#2B2E44; --muted:#62667F; --line:#E3E2F0;
  --accent:#5466D0; --accent-shadow:#3F4FB0; --on-accent:#FFFFFF; --accent-strong:#4553B8; --accent-soft:#E8E6FD;
  --pink:#FDE4EE; --mint:#D9F5EA; --sky:#DDEDFF; --lemon:#FFF3CC; --lavender:#E8E4FF; --peach:#FFE7DA;
  --glass:rgba(255,255,255,.72); --top-bg:rgba(247,247,252,.92);
  --ok-bg:#DDF5E7; --ok-line:#3E9E66; --ok-text:#1D5A37;
  --no-bg:#FDE4E8; --no-line:#D9707F; --no-text:#8A2B3A;
  --shadow:0 8px 24px rgba(70,74,140,.10); --shadow-sm:0 2px 10px rgba(70,74,140,.07);
  --toast-bg:#2B2E44; --toast-text:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  --cute:"Jua",var(--font);
}
/* 어둡게: 새까만 대신 차분한 남보라 톤 (기기 설정과 상관없이 🌙 버튼으로만 전환) */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#262A3E; --surface:#30344B; --surface-2:#3A3F58; --input-bg:#2C3045;
  --text:#F2F3FB; --muted:#C2C5DA; --line:#474C68;
  --accent:#9AA8F7; --accent-shadow:#6E7CD6; --on-accent:#1E2134; --accent-strong:#B5BFFF; --accent-soft:#454B78;
  --pink:#5C4258; --mint:#33574B; --sky:#37506E; --lemon:#5C5534; --lavender:#4A4777; --peach:#634A40;
  --glass:rgba(255,255,255,.09); --top-bg:rgba(38,42,62,.92);
  --ok-bg:#24503A; --ok-line:#74D497; --ok-text:#D2F7DE;
  --no-bg:#5A2D3B; --no-line:#F493A4; --no-text:#FFDCE2;
  --shadow:0 8px 24px rgba(0,0,0,.28); --shadow-sm:0 2px 10px rgba(0,0,0,.22);
  --toast-bg:#F2F3FB; --toast-text:#262A3E;
}
.icon-btn.theme svg{width:21px;height:21px}
/* v5: 떠올리기용 그림·사진을 카드 앞면 용어 위에 크게 */
.fpic{position:relative;width:100%;max-width:300px;height:clamp(130px,26vh,200px);margin:26px 0 14px;border-radius:20px;background:#fff;overflow:hidden;box-shadow:var(--shadow-sm);flex:0 0 auto}
.fpic img{width:100%;height:100%;object-fit:contain;display:block}
.fpic.q{height:clamp(120px,22vh,170px);margin:0 0 12px}
.zoom-btn{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.94);box-shadow:var(--shadow-sm);font-size:17px;display:grid;place-items:center}
.side-btn{position:absolute;top:12px;right:12px;font-size:12.5px;font-weight:700;background:var(--glass);border:1.5px dashed var(--accent);border-radius:999px;padding:4px 11px;color:var(--accent-strong)}
/* v6: 앞면은 용어 위 · 그림 아래 */
.front .term{margin-top:26px}
.front .illu{margin:16px 0 8px}
.front .fpic{margin:16px 0 22px}
.c-pink{--cc:var(--pink)} .c-mint{--cc:var(--mint)} .c-sky{--cc:var(--sky)}
.c-lemon{--cc:var(--lemon)} .c-lavender{--cc:var(--lavender)} .c-peach{--cc:var(--peach)}
.c-none{--cc:var(--surface-2)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.55;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh}

/* 상단바 */
.top{position:sticky;top:0;z-index:20;background:var(--top-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-inner{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:env(safe-area-inset-top) 16px 0}
.top-title{display:flex;align-items:center;gap:8px;font-family:var(--cute);font-size:21px;white-space:nowrap;min-width:0}
.top-title svg{width:28px;height:28px}
.top-actions{display:flex;align-items:center;gap:8px}
.top-date{font-size:13px;color:var(--muted);font-weight:600}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.help{font-family:var(--cute);font-size:21px;color:var(--accent-strong)}
.icon-btn.speaking{background:var(--accent);color:var(--on-accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

.view{padding:8px 16px calc(100px + env(safe-area-inset-bottom));animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 하단 탭 */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -4px 18px rgba(60,64,120,.08);border-radius:22px 22px 0 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0;min-height:54px}
.ti{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .2s}
.ti svg{width:23px;height:23px}
.tab.on{color:var(--accent-strong)}
.tab.on .ti{background:var(--accent-soft)}

/* 공통 */
.sec{margin-top:24px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-head h2{font-family:var(--cute);font-weight:400;font-size:20px}
.link{color:var(--accent-strong);font-weight:700;font-size:14px;padding:8px 4px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 20px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .1s,box-shadow .1s;text-decoration:none;cursor:pointer}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent-shadow)}
.btn.primary:active{box-shadow:0 2px 0 var(--accent-shadow)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line)}
.btn.danger{background:var(--no-bg);color:var(--no-text)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.empty{text-align:center;padding:26px 16px;background:var(--surface);border-radius:22px;border:2px dashed var(--line);color:var(--muted)}
.empty p{margin:8px 0 14px}

/* 홈 */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--lavender),var(--sky));border-radius:28px;padding:20px 10px 20px 20px;box-shadow:var(--shadow)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:var(--glass)}
.hero::before{width:120px;height:120px;right:-30px;top:-40px}
.hero::after{width:60px;height:60px;left:48%;bottom:-24px}
.hero-text{position:relative;z-index:1;flex:1;min-width:0}
.hero-kicker{margin:0;font-size:12.5px;font-weight:700;color:var(--accent-strong)}
.hero h1{font-family:var(--cute);font-weight:400;font-size:28px;line-height:1.2;margin:2px 0 6px}
.hero-desc{margin:0 0 14px;font-size:13.5px}
.hero-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero-btns .btn{min-height:42px;padding:0 16px;font-size:14px}
.hero-art{position:relative;z-index:1;flex:0 0 112px}
.hero-art svg{width:112px;height:auto;display:block;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.mini-stats{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.mini-stats span{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap}
.mini-stats b{color:var(--text);font-weight:800}

.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mark-chip{flex:0 0 108px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--cc);border-radius:20px;padding:12px;text-align:left;box-shadow:var(--shadow-sm)}
.mark-chip .mc-ico{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--glass)}
.mc-name{font-weight:700;font-size:14px;line-height:1.3;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-count{font-size:12px;color:var(--muted);font-weight:600}

.wlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.wrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow-sm)}
.thumb{flex:0 0 46px;height:46px;border-radius:15px;background:var(--cc);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.wbody{flex:1;min-width:0}
.wterm{display:block;font-weight:800;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wko{display:block;font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wmeta{flex:0 0 auto;font-size:11.5px;color:var(--muted);text-align:right;line-height:1.35}
.pill{display:inline-block;background:var(--cc);border-radius:999px;padding:1px 8px;font-weight:700;color:var(--text);max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.add-cta{margin-top:12px}

/* 학습장 */
.fchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.fchip b{font-size:12px;color:var(--muted)}
.fchip.on{background:var(--cc,var(--accent-soft));border-color:transparent;box-shadow:var(--shadow-sm)}
.fchip.on b{color:var(--text)}
.tools-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{min-height:34px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);font-weight:800;box-shadow:var(--shadow-sm)}

.scene{perspective:1300px;height:clamp(340px,52vh,460px);touch-action:pan-y}
.scene.from-right{animation:inR .28s ease}
.scene.from-left{animation:inL .28s ease}
@keyframes inR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.card3d{position:relative;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .6s cubic-bezier(.35,.8,.3,1.15);cursor:pointer;outline-offset:6px;border-radius:30px}
.card3d.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow);overflow:hidden}
.front{transform:rotateY(0deg);background:var(--cc);justify-content:center;background-image:radial-gradient(var(--glass) 1.6px,transparent 1.8px);background-size:22px 22px}
.back{transform:rotateY(180deg);background:var(--surface);border:3px solid var(--cc);padding-top:52px}
.tag{position:absolute;top:16px;left:16px;font-size:12.5px;font-weight:700;background:var(--glass);border-radius:999px;padding:3px 11px;max-width:68%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back .tag{background:var(--cc)}
.side{position:absolute;top:16px;right:16px;font-size:12px;font-weight:700;color:var(--muted)}
.illu{display:grid;place-items:center;width:156px;height:156px;border-radius:50%;background:var(--glass);margin-bottom:18px;overflow:hidden;flex:0 0 auto}
.illu img{width:100%;height:100%;object-fit:cover}
.illu.sm{width:68px;height:68px;margin-bottom:8px}
.term{font-family:var(--cute);font-size:clamp(28px,8.4vw,40px);line-height:1.2;text-align:center;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.hint{position:absolute;bottom:18px;font-size:12.5px;color:var(--muted);font-weight:600}
.ko{font-family:var(--cute);font-size:clamp(22px,6.8vw,30px);line-height:1.25;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.ko-sub{font-size:13.5px;color:var(--muted);margin-top:2px;text-align:center;word-break:break-word}
.desc{margin-top:14px;width:100%;flex:1 1 auto;overflow-y:auto;background:var(--surface-2);border-radius:18px;padding:14px 16px;font-size:15px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.desc-text{white-space:pre-wrap}
.wdate{margin-top:10px;font-size:12px;color:var(--muted)}
.pager{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:14px;margin-top:18px}
.round{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);font-size:30px;line-height:1;color:var(--text)}
.round:active{transform:scale(.94)}
.count{text-align:center;font-size:14px;color:var(--muted)}
.count b{font-family:var(--cute);font-weight:400;font-size:22px;color:var(--text)}
.bar{height:7px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.card-actions{display:flex;justify-content:center;gap:8px;margin-top:14px}

/* 퀴즈 */
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.score{font-family:var(--cute);font-size:18px;background:var(--lemon);border-radius:999px;padding:4px 14px}
.qcard{background:var(--cc);border-radius:26px;padding:22px 18px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center}
.qcard .illu{width:104px;height:104px;margin-bottom:10px}
.qprompt{font-family:var(--cute);font-size:clamp(22px,7vw,30px);line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.qask{font-size:13px;color:var(--muted);margin-top:6px;font-weight:600}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;min-height:56px;font-size:15px;font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.opt-no{flex:0 0 28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:800}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-text)}
.opt.no{background:var(--no-bg);border-color:var(--no-line);color:var(--no-text)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.feedback{margin-top:14px;border-radius:18px;padding:14px 16px;font-size:14.5px;line-height:1.6}
.feedback.ok{background:var(--ok-bg);color:var(--ok-text)}
.feedback.no{background:var(--no-bg);color:var(--no-text)}
.feedback strong{font-family:var(--cute);font-weight:400;font-size:19px;display:block;margin-bottom:2px}
.next-q{margin-top:12px}

/* 등록 폼 */
.form{background:var(--surface);border-radius:24px;padding:18px 16px;box-shadow:var(--shadow-sm)}
.field{display:block;margin-bottom:18px}
.lbl{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;font-weight:800;font-size:14.5px;margin-bottom:7px}
.lbl em{color:var(--no-text);font-style:normal}
.lbl small{font-weight:600;color:var(--muted);font-size:12px}
.inp{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:15px;background:var(--input-bg);padding:12px 14px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:110px;line-height:1.6}
.row{display:flex;gap:8px;align-items:center}
.row .inp{flex:1;min-width:0}
.ill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px}
.ill-opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1;border-radius:18px;background:var(--surface-2);border:2.5px solid transparent;font-size:11px;font-weight:700;color:var(--muted);overflow:hidden;cursor:pointer}
.ill-opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.ill-opt img{width:42px;height:42px;object-fit:cover;border-radius:12px}
.ill-opt.upload{font-size:24px;line-height:1;color:var(--accent-strong);border:2.5px dashed var(--line);background:transparent}
.ill-opt.upload span{font-size:11px;color:var(--muted)}
.err{color:var(--no-text);background:var(--no-bg);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:14px}
.edit-banner{display:flex;justify-content:space-between;align-items:center;background:var(--lemon);border-radius:16px;padding:6px 8px 6px 14px;margin-bottom:14px;font-weight:700;font-size:14px}
.form-btns{display:grid;gap:10px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 엑셀 */
.xls-card{display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,var(--mint),var(--sky));border-radius:22px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.xls-card h3{font-family:var(--cute);font-weight:400;font-size:19px}
.xls-card p{margin:0;font-size:13px;line-height:1.55}
.xls-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.imp-sum{display:grid;gap:6px;background:var(--surface-2);border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:12px;line-height:1.5}
.imp-list{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.imp-list li{border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px;line-height:1.45}
.imp-list .it{font-weight:800}
.imp-list .im{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}

/* 책갈피 관리 */
.mlist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.mitem{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:20px;padding:10px 8px 10px 10px;box-shadow:var(--shadow-sm);border-left:8px solid var(--cc)}
.mmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:2px}
.mico{flex:0 0 52px;height:52px;border-radius:16px;background:var(--cc);display:grid;place-items:center}
.mname{display:block;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcount{font-size:13px;color:var(--muted)}
.mbtns{display:flex;flex:0 0 auto}
.mini{display:grid;place-items:center;width:36px;height:40px;border-radius:12px;font-size:16px;color:var(--muted)}
.mini:active{background:var(--surface-2)}
.mini:disabled{opacity:.3}
.datebox{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow-sm)}
.datebox p{margin:0 0 12px;font-size:13.5px}
.datebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.datebtns .full{grid-column:1/-1}

/* 설명 이미지 · 바로 수정 · 사용법 */
.dimg{display:block;width:100%;margin:0 0 12px;padding:0;border-radius:14px;overflow:hidden;background:#fff;cursor:zoom-in;box-shadow:var(--shadow-sm)}
.dimg img{display:block;width:100%;max-height:140px;object-fit:contain}
.dimg.icon{display:grid;place-items:center;padding:8px;background:var(--glass);cursor:default;box-shadow:none}
.dimg-add{display:inline-flex;margin-top:12px;border:2px dashed var(--line);border-radius:12px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);background:transparent}
.dimg-box{display:grid;gap:8px}
.dimg-prev{border-radius:16px;overflow:hidden;background:var(--surface-2);min-height:96px;display:grid;place-items:center;border:2px dashed var(--line);color:var(--muted);font-size:13px;text-align:center;padding:10px}
.dimg-prev img{max-width:100%;max-height:220px;object-fit:contain;border-radius:10px;display:block;background:#fff}
.dimg-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dimg-btns .full{grid-column:1/-1}
.dimg-tip{font-size:12px;margin:0;color:var(--muted)}
.edit-card{background:var(--surface);border:3px solid var(--cc);border-radius:26px;padding:18px 16px;box-shadow:var(--shadow);scroll-margin-top:70px}
.edit-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.edit-head h3{font-family:var(--cute);font-weight:400;font-size:21px}
.edit-btns{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:6px}
.zoom-img{width:100%;max-height:70vh;object-fit:contain;border-radius:14px;background:#fff;display:block;margin-bottom:12px}
.guide{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.guide li{display:flex;gap:12px;background:var(--surface-2);border-radius:16px;padding:12px 14px}
.gi{flex:0 0 38px;height:38px;border-radius:12px;background:var(--cc);display:grid;place-items:center;font-size:19px}
.guide .gh{display:block;font-size:15px;margin-bottom:2px}
.gt{font-size:13.5px;line-height:1.6}
.guide-note{margin:12px 2px 14px;font-size:12.5px;color:var(--muted);line-height:1.6}

/* 바텀시트 */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(20,22,40,.42);animation:fadeBg .2s ease}
@keyframes fadeBg{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.3,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:var(--cute);font-weight:400;font-size:22px;margin-bottom:8px}
.sheet p{margin:0 0 16px;font-size:14.5px;line-height:1.6}
.sheet-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.sheet-btns.col{grid-template-columns:1fr}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;background:var(--cc);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--toast-bg);color:var(--toast-text);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* v6: 뒷면은 내용만큼 카드가 길어짐 (카드 안 스크롤 없음) — 앞쪽 규칙을 덮어쓰도록 맨 끝에 둠 */
.scene{transition:height .45s ease}
.back{inset:0 0 auto 0;min-height:100%;justify-content:center;padding:52px 18px 16px}
.ko{font-size:clamp(18px,5.4vw,22px);line-height:1.4}
.desc{flex:none;overflow:visible;font-size:14.5px;line-height:1.7;padding:14px 15px}
.desc p{margin:0 0 6px}
.desc p:last-child{margin-bottom:0}
.ex-box{margin:8px 0 4px;background:var(--lemon);border-radius:14px;padding:9px 12px;font-size:14px;line-height:1.6}
.ex-box div+div{margin-top:3px}
.ex-h{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:2px}
.pt-list{margin:6px 0;padding-left:20px}
.pt-list li{margin:2px 0}
.pt-list li::marker{color:var(--accent)}
.back .wdate{margin-top:12px}

/* v8: 뜻이 긴 노트도 목록 안에 들어오도록 (오른쪽 날짜 칸 잘림 방지) */
.wlist{grid-template-columns:minmax(0,1fr)}
.wlist li{min-width:0}
.imp-list li{min-width:0}

@media (min-width:600px){
  body{background:radial-gradient(circle at 20% 10%,var(--lavender),transparent 40%),radial-gradient(circle at 80% 80%,var(--sky),transparent 40%),var(--bg);background-attachment:fixed}
  .app{background:var(--bg);box-shadow:0 0 40px rgba(60,64,120,.12)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ============ 음성(TTS) ============ */
const ttsOK = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
function stopSpeak() { if (ttsOK) speechSynthesis.cancel(); const b = $('#speakBtn'); if (b) b.classList.remove('speaking'); }
function speak(text, lang) {
  if (!ttsOK) { toast('이 브라우저는 음성 읽기를 지원하지 않아요'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = lang.startsWith('en') ? 0.85 : 1;
  const voices = speechSynthesis.getVoices();
  const v = voices.find(v => v.lang.replace('_', '-') === lang) || voices.find(v => v.lang.toLowerCase().startsWith(lang.slice(0, 2)));
  if (v) u.voice = v;
  const b = $('#speakBtn');
  u.onstart = () => b && b.classList.add('speaking');
  u.onend = u.onerror = () => b && b.classList.remove('speaking');
  speechSynthesis.speak(u);
}
function speakCurrent() {
  if (ttsOK && speechSynthesis.speaking) { stopSpeak(); return; }
  if (ui.deck.mode === 'quiz') {
    const q = ui.quiz.q; if (!q) return;
    const w = db.words.find(x => x.id === q.id); if (!w) return;
    const t = ui.quiz.dir === 'e2k' ? w.term : meaning(w);
    speak(t, langOf(t));
    return;
  }
  const w = deckList()[ui.deck.idx]; if (!w) { toast('읽을 노트가 없어요'); return; }
  if (ui.deck.flipped) speak(`${w.korean ? w.korean + '. ' : ''}${w.desc}`, 'ko-KR');
  else speak(w.term, langOf(w.term));
}

/* 학습 내용 꾸미기: '예)'로 시작하는 줄은 예시 상자, '-·•※' 줄은 요점 목록 */
function richDesc(text) {
  let html = '', ex = [], pts = [];
  const flush = () => {
    if (ex.length) { html += `<div class="ex-box"><span class="ex-h">💡 예시</span>${ex.map(l => `<div>${esc(l)}</div>`).join('')}</div>`; ex = []; }
    if (pts.length) { html += `<ul class="pt-list">${pts.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`; pts = []; }
  };
  for (const raw of String(text).split(/\r?\n/)) {
    const l = raw.trim(); let m;
    if ((m = /^(?:예\s*[):]|예시\s*[):]|ex\)|e\.g\.)\s*(.*)$/i.exec(l))) { if (pts.length) flush(); ex.push(m[1] || l); }
    else if ((m = /^[-•※▶*]\s*(.+)$/.exec(l))) { if (ex.length) flush(); pts.push(m[1]); }
    else { flush(); if (l) html += `<p>${esc(l)}</p>`; }
  }
  flush();
  return html;
}
/* 뒤집었을 때 카드 높이를 뒷면 내용만큼 늘리고, 앞면으로 돌아오면 원래 크기로 */
function syncScene() {
  const sc = $('#scene'), c = $('#card'); if (!sc || !c) return;
  if (!ui.deck.flipped) { sc.style.height = ''; return; }
  const back = $('.back', c);
  sc.style.height = '';
  const base = sc.offsetHeight;
  back.style.minHeight = '0';
  const need = back.offsetHeight;
  back.style.minHeight = '';
  sc.style.height = Math.max(base, need) + 'px';
}
function flip() {
  if (ui.editing || Date.now() - lastSwipe < 450) return;
  const c = $('#card'); if (!c) return;
  stopSpeak();
  ui.deck.flipped = !ui.deck.flipped;
  c.classList.toggle('flipped', ui.deck.flipped);
  syncScene();
  c.setAttribute('aria-pressed', ui.deck.flipped);
  $('.front', c).setAttribute('aria-hidden', ui.deck.flipped);
  $('.back', c).setAttribute('aria-hidden', !ui.deck.flipped);
}
function move(dir) {
  const n = deckList().length; if (n < 2 || ui.editing) return;
  stopSpeak();
  ui.deck.idx = (ui.deck.idx + dir + n) % n;
  ui.deck.flipped = false;
  renderDeckBody(dir > 0 ? 'from-right' : 'from-left');
}

  const w = deckList()[ui.deck.idx]; if (!w) return;
  const v = readNoteFields(); if (!v) return;

  const id = w.id, descImg = validDescImg(dimg.value);

  toast('수정했어요 ✏️');

}

/* ---- 퀴즈 ---- */
function newQuestion(list) {
  const dir = ui.quiz.dir;
  const ansOf = w => dir === 'e2k' ? meaning(w) : w.term;
  const pool = list.filter(w => ansOf(w));
  if (pool.length < 4) return null;
  const cands = pool.filter(w => w.id !== ui.quiz.lastId);
  const w = cands[Math.floor(Math.random() * cands.length)];
  const right = ansOf(w), seen = new Set([norm(right)]), wrong = [];
  for (const o of shuffle(pool.filter(x => x.id !== w.id))) {
    const a = ansOf(o), k = norm(a);
    if (!seen.has(k)) { seen.add(k); wrong.push(a); }
    if (wrong.length === 3) break;
  }
  if (wrong.length < 3) return null;
  ui.quiz.lastId = w.id;
  return { id: w.id, chosen: null, options: shuffle([{ label: right, correct: true }, ...wrong.map(l => ({ label: l, correct: false }))]) };
}
function quizView() {
  const list = deckList(), qz = ui.quiz;
  if (!qz.q || !db.words.some(w => w.id === qz.q.id)) qz.q = newQuestion(list);

    db.bookmarks = db.bookmarks.filter(x => x.id !== id);
    if (removeWords) db.words = db.words.filter(w => w.bookmarkId !== id);
    else db.words.forEach(w => { if (w.bookmarkId === id) w.bookmarkId = null; });
  });
  if (!ok) return;
  if (ui.deck.filter === id) { ui.deck.filter = 'all'; ui.deck.idx = 0; }
  if (ui.lastBm === id) ui.lastBm = null;
  toast('책갈피를 삭제했어요'); render();
}
function moveMark(id, dir) {
  const i = db.bookmarks.findIndex(b => b.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= db.bookmarks.length) return;
  commit(() => { const a = db.bookmarks; [a[i], a[j]] = [a[j], a[i]]; });
  render();
}
function exportData() {
  try {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `학습노트_백업_${todayStr().replace(/-/g, '')}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    toast('백업 파일을 저장했어요 💾');
  } catch (e) { toast('백업 파일을 만들지 못했어요'); }
}
async function importData(file) {
  let data = null;
  try { data = sanitize(JSON.parse(await file.text())); } catch (e) { data = null; }
  if (!data) { toast('학습노트 백업 파일이 아니에요'); return; }
  const r = await ask('백업 불러오기', `책갈피 <b>${data.bookmarks.length}개</b>, 노트 <b>${data.words.length}개</b>가 들어 있어요.`,
    [{ label: '지금 데이터와 합치기', cls: 'primary' }, { label: '지금 데이터를 지우고 바꾸기', cls: 'danger' }, { label: '취소' }]);
  if (r === 0) {
    const ok = commit(() => {
      const bIds = new Set(db.bookmarks.map(b => b.id)), wIds = new Set(db.words.map(w => w.id));
      data.bookmarks.forEach(b => { if (!bIds.has(b.id)) db.bookmarks.push(b); });
      data.words.forEach(w => { if (!wIds.has(w.id)) db.words.push(w); });
    });
    if (!ok) return;
  } else if (r === 1) { if (!commit(() => { db = data; })) return; }
  else return;
  ui.deck.filter = 'all'; ui.deck.idx = 0; ui.quiz.q = null;
  toast('백업을 불러왔어요'); render();
}
async function resetAll() {
  const r = await ask('전체 삭제', `책갈피 ${db.bookmarks.length}개와 노트 ${db.words.length}개를 <b>모두 삭제</b>해요. 되돌릴 수 없으니 먼저 백업을 권해요.`,
    [{ label: '모두 삭제', cls: 'danger' }, { label: '취소' }]);
  if (r !== 0) return;
  commit(() => { db = { version: 3, bookmarks: [], words: [] }; });
  ui.deck = { filter: 'all', sort: 'mark', idx: 0, flipped: false, mode: 'card' }; ui.quiz.q = null; ui.lastBm = null;
  toast('모두 삭제했어요'); render();
}

/* ============ 사용법 ============ */
function openGuide() {
  const G = (ic, c, t, d) => `<li><span class="gi c-${c}">${ic}</span><span><b class="gh">${t}</b><span class="gt">${d}</span></span></li>`;
  openSheet(`<h3>📖 학습노트 사용법</h3>
    <ul class="guide">
      ${G('🔖', 'lavender', '1. 책갈피 만들기', '책갈피는 <b>교과목 폴더</b>예요. <b>책갈피</b> 탭에서 이름·색·아이콘을 정해 만들어요.')}
      ${G('✏️', 'lemon', '2. 노트 등록하기', '<b>노트등록</b> 탭에서 용어·개념, 뜻·핵심, 학습 내용을 적어요. 단원과 <b>앞면 그림·사진</b>도 넣을 수 있어요. 그림을 보고 개념을 떠올린 뒤 뒤집어 확인해요.')}
      ${G('📊', 'mint', '3. 엑셀로 한꺼번에', '<b>📥 양식 받기</b> → 엑셀에 한 줄씩 정리 → <b>📤 엑셀 올리기</b>. 미리보기를 확인하면 과목별로 한 번에 만들어져요.')}
      ${G('🃏', 'sky', '4. 카드로 복습', '<b>학습장</b>에서 카드를 탭하면 뒤집혀요. 좌우로 밀거나 ‹ › 로 넘기고, 위쪽 🔊 버튼으로 읽어 줘요.')}
      ${G('🎯', 'peach', '5. 퀴즈 풀기', '학습장 위쪽에서 <b>퀴즈</b>로 바꾸면 4지선다 문제가 나와요. 노트가 4개 이상 있어야 해요.')}
      ${G('🛠️', 'pink', '6. 카드에서 바로 수정', '카드 아래 <b>✏️ 이 카드 바로 수정</b>으로 그 자리에서 고쳐요. 앞면의 <b>＋ 그림</b>으로 그림을 바로 넣을 수 있어요.')}
      ${G('💾', 'lavender', '7. 백업하기', '기록은 <b>이 기기의 브라우저</b>에만 저장돼요. 책갈피 탭에서 가끔 <b>백업 내보내기</b>를 해 두세요.')}
    </ul>
    <p class="guide-note">💡 사용법은 화면 오른쪽 위 <b>?</b> 버튼으로 언제든 다시 볼 수 있어요.<br>🌙 / ☀️ 버튼을 누르면 화면을 <b>어둡게 · 밝게</b> 바꿀 수 있어요.</p>
    <div class="sheet-btns col"><button class="btn primary" data-act="sheet-close">시작하기</button></div>`);
  try { localStorage.setItem(GUIDE_KEY, '1'); } catch (e) {}
}

/* ============ 라우팅 ============ */
const PAGES = { home: pageHome, deck: pageDeck, add: pageAdd, marks: pageMarks };
function header() {
  const t = ui.tab, dnames = ['일', '월', '화', '수', '목', '금', '토'], d = new Date();
  const titles = { home: `${icon('book', 28)}나만의 학습노트`, deck: '학습장', add: ui.edit ? '노트 수정' : '노트 등록', marks: '책갈피' };
  $('#topTitle').innerHTML = titles[t];
  const lead = t === 'deck'
    ? `<button class="icon-btn" id="speakBtn" data-act="speak" aria-label="음성으로 듣기" title="음성으로 듣기">${SPEAKER}</button>`
    : '';
  const dark = curTheme() === 'dark';
  const themeBtn = `<button class="icon-btn theme" data-act="theme" aria-label="${dark ? '밝게 보기' : '어둡게 보기'}" title="${dark ? '밝게 보기' : '어둡게 보기'}">${dark ? SUN : MOON}</button>`;
  $('#topActions').innerHTML = `<div class="top-actions">${lead}${themeBtn}<button class="icon-btn help" data-act="help" aria-label="사용법 보기" title="사용법">?</button></div>`;
}

/* ---- 밝게 / 어둡게 ---- */
const THEME_KEY = 'myStudyNote.theme';
const SUN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>`;
const MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6z"/></svg>`;
const curTheme = () => document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const m = $('#themeColor'); if (m) m.setAttribute('content', t === 'dark' ? '#262A3E' : '#F7F7FC');
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  header();
  toast(t === 'dark' ? '🌙 어둡게 바꿨어요' : '☀️ 밝게 바꿨어요');
}
function render() {
  ui.editing = false;
  header();
  $$('.tab').forEach(b => { const on = b.dataset.tab === ui.tab; b.classList.toggle('on', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'); });
  view.innerHTML = PAGES[ui.tab]();
  view.style.animation = 'none'; void view.offsetWidth; view.style.animation = '';
  if (ui.tab === 'deck') syncScene();
}
function go(tab) {
  if (tab !== 'deck') stopSpeak();
  ui.tab = tab; render(); window.scrollTo(0, 0);
}

/* ============ 이벤트 ============ */
document.addEventListener('click', e => {
  const askBtn = e.target.closest('[data-ask]');
  if (askBtn) { const r = askResolver; askResolver = null; closeSheet(); if (r) r(Number(askBtn.dataset.ask)); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, d = ui.deck;
  switch (act) {
    case 'go': if (el.dataset.tab === 'add') ui.edit = null; go(el.dataset.tab); break;
    case 'quiz-start': d.mode = 'quiz'; ui.quiz.q = null; go('deck'); break;
    case 'open-mark': d.filter = id; d.idx = 0; d.flipped = false; d.mode = 'card'; go('deck'); break;
    case 'open-word': d.filter = 'all'; d.mode = 'card'; d.flipped = false; d.idx = Math.max(0, deckList().findIndex(w => w.id === id)); go('deck'); break;
    case 'filter': d.filter = el.dataset.f; d.idx = 0; d.flipped = false; ui.quiz.q = null; ui.quiz.score = ui.quiz.total = 0; stopSpeak(); render(); break;
    case 'sort': d.sort = el.dataset.s; d.idx = 0; d.flipped = false; render(); break;
    case 'mode': d.mode = el.dataset.m; ui.quiz.q = null; d.flipped = false; stopSpeak(); render(); break;
    case 'flip': flip(); break;
    case 'prev': move(-1); break;
    case 'next': move(1); break;
    case 'speak': speakCurrent(); break;
    case 'edit-word': ui.edit = id; go('add'); break;
    case 'edit-inline': {
      if (d.mode !== 'card' || !deckList()[d.idx]) break;
      stopSpeak(); ui.editing = true; dimg.value = deckList()[d.idx].descImg || '';
      renderDeckBody();
      const target = el.dataset.focus === 'dimg' ? $('#dimgBox') : $('#inlineForm');
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
    case 'edit-cancel': ui.editing = false; renderDeckBody(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'zoom': {
      const w = db.words.find(x => x.id === id);
      if (w && isPhoto(w.descImg)) openSheet(`<h3>${esc(w.term)}</h3><img class="zoom-img" src="${w.descImg}" alt="${esc(w.term)} 관련 이미지"><div class="sheet-btns col"><button class="btn ghost" data-act="sheet-close">닫기</button></div>`);
      break;
    }
    case 'dimg-pick': openDimgPicker(); break;
    case 'dimg-key': dimg.value = el.dataset.key; closeSheet(); refreshDimg(); break;
    case 'dimg-clear': dimg.value = ''; refreshDimg(); break;
    case 'help': openGuide(); break;
    case 'theme': setTheme(curTheme() === 'dark' ? 'light' : 'dark'); break;
    case 'xls-template': downloadTemplate(); break;
    case 'import-xls': commitImport(); break;
    case 'qdir': ui.quiz.dir = el.dataset.d; ui.quiz.q = null; ui.quiz.score = ui.quiz.total = 0; stopSpeak(); render(); break;
    case 'answer': answer(Number(el.dataset.i)); break;
    case 'quiz-next': ui.quiz.q = null; stopSpeak(); renderDeckBody(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'pick-ill': form.illust = el.dataset.key; form.manual = true; refreshIllGrid(); break;
    case 'new-mark-inline': openMarkSheet(null, true); break;
    case 'cancel-edit': ui.edit = null; go('deck'); break;
    case 'del-word': deleteWord(ui.edit); break;
    case 'new-mark': openMarkSheet(null, false); break;
    case 'edit-mark': openMarkSheet(id, false); break;
    case 'del-mark': deleteMark(id); break;
    case 'mark-move': moveMark(id, Number(el.dataset.dir)); break;
    case 'pick-color': if (sheetState) { sheetState.color = el.dataset.c; refreshSheetPicks(); } break;
    case 'pick-micon': if (sheetState) { sheetState.icon = el.dataset.key; refreshSheetPicks(); } break;
    case 'save-mark': saveMark(); break;
    case 'sheet-close': closeSheet(); break;
    case 'export': exportData(); break;
    case 'reset-all': resetAll(); break;
  }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'wordForm') { e.preventDefault(); submitWord(); }
  else if (e.target.id === 'inlineForm') { e.preventDefault(); saveInline(); }
});
document.addEventListener('paste', e => {
  if (!$('#dimgBox') || !$('#sheet').hidden) return;
  const item = Array.from((e.clipboardData && e.clipboardData.items) || []).find(it => it.kind === 'file' && /^image\//.test(it.type));
  if (!item) return;
  e.preventDefault();
  setDimgFromFile(item.getAsFile());
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'fBm') {
    if (!form.manual && $('#illGrid')) { const b = db.bookmarks.find(b => b.id === t.value); form.illust = b ? b.icon : 'book'; refreshIllGrid(); }
  } else if (t.id === 'fImg') {
    const f = t.files && t.files[0]; t.value = ''; if (!f) return;
    if (f.size > 15e6) { toast('15MB 이하 사진만 올릴 수 있어요'); return; }
    try { form.illust = await readImage(f); form.manual = true; refreshIllGrid(); toast('사진을 작게 줄여서 넣었어요 📷'); }
    catch (err) { toast('이 이미지는 읽을 수 없어요'); }
  } else if (t.id === 'dimgFile') {
    const f = t.files && t.files[0]; t.value = ''; setDimgFromFile(f);
  } else if (t.id === 'xlsFile') {
    const f = t.files && t.files[0]; t.value = ''; if (f) handleXlsFile(f);
  } else if (t.id === 'impSkipDup') {
    const p = pendingImport, b = $('#impGo');
    if (p && b) b.textContent = `${p.items.length - (t.checked ? p.dups : 0)}개 만들기`;
  } else if (t.id === 'importFile') {
    const f = t.files && t.files[0]; t.value = ''; if (f) importData(f);
  }
});
document.addEventListener('keydown', e => {
  const sheetOpen = !$('#sheet').hidden;
  if (e.key === 'Escape' && sheetOpen) { closeSheet(); return; }
  if (e.key === 'Enter' && sheetOpen && e.target.id === 'mName') { e.preventDefault(); saveMark(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('label[for]')) {
    const inp = document.getElementById(e.target.getAttribute('for'));
    if (inp && inp.type === 'file') { e.preventDefault(); inp.click(); return; }
  }
  if (sheetOpen || ui.tab !== 'deck' || ui.deck.mode !== 'card' || ui.editing) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
  else if (e.key === ' ' || e.key === 'Enter') {
    if (tag === 'BUTTON') return;
    e.preventDefault(); flip();
  }
});
let sx = 0, sy = 0;
view.addEventListener('touchstart', e => { if (!e.target.closest('#scene')) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
view.addEventListener('touchend', e => {
  if (!e.target.closest('#scene')) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) { lastSwipe = Date.now(); move(dx < 0 ? 1 : -1); }
});
window.addEventListener('resize', () => syncScene());
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => syncScene());
if (ttsOK && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

render();
if (!storageOK) setTimeout(() => toast('⚠️ 이 브라우저에서는 저장이 안 돼요 (시크릿 모드?)'), 600);
/* v8: 사용법은 '처음 접속할 때 한 번만' 자동으로 띄움.
   저장이 안 되는 환경(시크릿 창·메신저 안 브라우저·미리보기 등)에서는 '봤음'을 기억할 수 없어 매번 뜨므로,
   그런 곳에서는 자동으로 띄우지 않고 오른쪽 위 ? 버튼으로만 열게 함. */
let guideSeen = true;
if (storageOK) { try { guideSeen = localStorage.getItem(GUIDE_KEY) === '1'; } catch (e) { guideSeen = true; } }
if (!guideSeen) setTimeout(openGuide, 400);
})();
</script>
